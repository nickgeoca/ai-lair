name: Feature proposal
description: Propose a focused improvement or additional harness use case.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user-visible behavior and relevant non-goals.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Boundary impact
      description: Describe any new mounts, network access, credentials, host services, or import/export behavior.
    validations:
      required: true
